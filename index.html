<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FIELDNOTE 工程地質學習筆記</title>
  <meta name="description" content="構造位態、岩性辨識與坡地觀察的學生野外筆記 App。">
  <meta name="theme-color" content="#22584a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FIELDNOTE">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar" id="topbar">
      <div class="wordmark"><b>FIELDNOTE</b><span>工程地質學習筆記</span></div>
      <span class="spacer"></span>
      <span class="status-pill hidden" id="mem-pill">筆記未長期保存</span>
      <button class="icon-btn" data-act="go" data-view="about" aria-label="使用說明與備份">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      </button>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="主選單">
    <button data-act="go" data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>工作台</button>
    <button data-act="go" data-view="field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.1 6.3 9.9 4.2a2 2 0 0 0-1.8 0L3.6 6.5A1 1 0 0 0 3 7.4v12.1a1 1 0 0 0 1.4.9l3.7-1.9a2 2 0 0 1 1.8 0l4.2 2.1a2 2 0 0 0 1.8 0l4.5-2.3a1 1 0 0 0 .6-.9V5.3a1 1 0 0 0-1.4-.9l-3.7 1.9a2 2 0 0 1-1.8 0z"/><path d="M15 6.8v14M9 3.2v14"/></svg>野外</button>
    <div class="fab-slot"><button class="fab" data-act="new" data-topic="structure" aria-label="新增觀測"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
    <button data-act="go" data-view="records"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4"/><path d="M2 6h4M2 10h4M2 14h4M2 18h4"/><path d="M21.4 5.6a2.1 2.1 0 1 0-3-3l-5 5a2 2 0 0 0-.5.9l-.8 2.8a.5.5 0 0 0 .6.6l2.9-.8a2 2 0 0 0 .8-.5z"/></svg>筆記</button>
    <button data-act="go" data-view="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>學習</button>
  </nav>

  <div id="bar-slot"></div>
  <div id="sheet-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <input type="file" id="photo-input" accept="image/jpeg,image/png,image/webp,image/heic" class="hidden">
  <input type="file" id="import-input" accept=".json,application/json" class="hidden">
  <input type="file" id="overlay-input" accept=".kml,.kmz,.geojson,.json,application/vnd.google-earth.kml+xml,application/vnd.google-earth.kmz" class="hidden">

  <script src="js/data.js"></script>
  <script src="js/fieldmaps.js"></script>
  <script src="js/fieldtrip.js"></script>
  <script src="js/kmz.js"></script>
  <script src="js/overlaydata.js"></script>
  <script src="js/overlays.js"></script>
  <script src="js/report.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
